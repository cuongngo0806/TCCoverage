[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcadvisor"
version = "0.1.0"
description = "Change Impact & Test Case Advisor: evidence-backed test cases to check for a C++/CMake change"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["libclang>=16"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
tcadvisor = "tcadvisor.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcadvisor = ["report/*.html", "verify/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
