name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python3 -m pytest -q
      - name: leveldb ground-truth eval
        run: python3 scripts/eval_real_project.py --quiet
      - name: Seeded side-effect regressions (recall gate)
        # thresholds: specs/010-accessor-readers-ci/results.md; raise them when recall improves, never lower silently
        run: >
          python3 scripts/seeded_regressions.py --quiet
          --min-victims dev=12 --min-corners dev=12
          --min-victims holdout=10 --min-corners holdout=10
          --min-victims yamlcpp=9 --min-corners yamlcpp=9


  python310:
    # oldest supported Python (Ubuntu 22.04 ships 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and integration tests
        run: python3 -m pytest -q
